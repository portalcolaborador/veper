<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Colaborador</title>
    <!--
        Este arquivo (página dos colaboradores no GitHub) só redireciona para o Portal do Colaborador no Apps Script.
        Para trocar o endereço, altere a URL_APP abaixo E a URL do meta refresh.
        O portal não usa chave: o colaborador entra com matrícula + CPF + data de nascimento.
    -->
    <meta http-equiv="refresh" content="2;url=https://script.google.com/macros/s/AKfycbxpDJaByu1lLFHrI_jMJs9V0PskS6ZbNGCtyE4Qlgq3n9rRFi5QahcWGz4P_W6KFMwRbA/exec?page=portal">
    <style>
        html, body { margin: 0; height: 100%; background: #0a1730; color: #f8fafc;
            font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; }
        h1 { font-size: 20px; margin: 18px 0 6px; }
        p { color: #9fb0d0; margin: 0; font-size: 14px; }
        a { color: #93c5fd; }
        .spin { width: 34px; height: 34px; margin: 0 auto; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: g .8s linear infinite; }
        @keyframes g { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div>
        <div class="spin"></div>
        <h1>Portal do Colaborador</h1>
        <p>Abrindo o portal...</p>
        <p style="margin-top:14px;"><a id="link" href="https://script.google.com/macros/s/AKfycbxpDJaByu1lLFHrI_jMJs9V0PskS6ZbNGCtyE4Qlgq3n9rRFi5QahcWGz4P_W6KFMwRbA/exec?page=portal">Toque aqui se não abrir sozinho</a></p>
    </div>
    <script>
        var URL_APP = "https://script.google.com/macros/s/AKfycbxpDJaByu1lLFHrI_jMJs9V0PskS6ZbNGCtyE4Qlgq3n9rRFi5QahcWGz4P_W6KFMwRbA/exec";
        // replace() não deixa esta página no histórico (o "voltar" do celular não cai aqui de novo)
        window.location.replace(URL_APP + "?page=portal");
    </script>
</body>
</html>
