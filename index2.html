<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carômetro Operacional - Segurança Externa</title>
    <style>
        /* =========================================
           ESTILOS GERAIS E FUNDO
           ========================================= */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://lh3.googleusercontent.com/d/1Ks1EdzxcIePp0Y7r_c8mAVDQ4qpwJoTP');
            background-repeat: no-repeat; background-position: center; background-size: 25%;
            z-index: 0; pointer-events: none;
        }

        :root {
            --bg-color: #1e293b; --panel-bg: #0f172a; --text-light: #f8fafc; --text-dark: #0f172a;
            --border-color: #334155; --cor-grupo-a: #dc2626; --cor-grupo-b: #eab308;
            --cor-grupo-c: #2563eb; --cor-grupo-d: #16a34a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

        body {
            background-color: var(--bg-color); color: var(--text-light);
            padding: 15px; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* =========================================
           CABEÇALHO
           ========================================= */
        .header-painel, .secao-bloco, .area-status-inferior, .area-status-superior {
            background-color: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(2px); position: relative; z-index: 1;
        }

        .header-painel {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 25px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px;
        }
        .header-painel h1 { font-size: 22px; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
        .logo-area { font-weight: bold; font-size: 16px; color: #94a3b8; letter-spacing: 2px; }

        /* =========================================
           GRID PRINCIPAL E BLOCOS
           ========================================= */
        .quadro-principal { display: grid; grid-template-columns: 1fr; flex: 1; min-height: 0; }
        .grade-grupos {
            display: grid; grid-template-columns: 0.5fr 0.5fr 0.5fr 0.5fr; gap: 12px;
            height: 100%; min-height: 0;
            transition: grid-template-columns 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: grid-template-columns;
        }

        .secao-bloco {
            border: 1px solid var(--border-color); border-radius: 8px; padding: 10px;
            display: flex; flex-direction: column; min-height: 0; max-height: 100%; overflow: hidden !important;
        }
        .titulo-secao {
            text-align: center; font-weight: 700; padding: 6px; margin-bottom: 10px;
            border-radius: 4px; text-transform: uppercase; font-size: 13px; color: #fff; white-space: nowrap;
        }

        .bg-grupo-a { background-color: var(--cor-grupo-a); }
        .bg-grupo-b { background-color: var(--cor-grupo-b); color: #000; }
        .bg-grupo-c { background-color: var(--cor-grupo-c); }
        .bg-grupo-d { background-color: var(--cor-grupo-d); }

        .zona-fotos {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            grid-auto-rows: 106px; gap: 3px; align-content: flex-start; flex: 1; overflow-y: auto !important; overflow-x: hidden !important;
        }
        .zona-fotos::-webkit-scrollbar, .fotos-status-linha::-webkit-scrollbar { width: 0px; }

        /* =========================================
           STATUS INFERIOR / SUPERIOR
           ========================================= */
        .area-status-inferior { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .linha-status { display: grid; grid-template-columns: 180px 1fr; gap: 12px; align-items: center; }
        .label-status {
            background: #334155; color: #fff; font-weight: bold; text-transform: uppercase;
            font-size: 11px; padding: 8px; text-align: center; border-radius: 6px; border: 1px solid var(--border-color);
        }

        .fotos-status-linha {
            background: rgba(15, 23, 42, 0.45) !important; border: 1px solid var(--border-color); border-radius: 8px;
            padding: 6px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
            grid-auto-rows: 66px; gap: 8px; min-height: 50px; max-height: 150px; align-items: center; overflow-y: auto !important;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }

        /* =========================================
           CARDS DOS VIGILANTES
           ========================================= */
        .vigilante-container { width: 84px; height: 106px; }
        .fotos-status-linha .vigilante-container { width: 52px !important; height: 66px !important; }
        .fotos-status-linha .vigilante-nome-tag { font-size: 7.5px !important; padding: 1px 0 !important; }
        .fotos-status-linha .vigilante-card div[style*="position: absolute"] { padding: 0px 2px !important; }
        .fotos-status-linha .vigilante-card div[style*="position: absolute"] span { font-size: 7px !important; }

        .vigilante-card {
            width: 100%; height: 100%; border: 2px solid #64748b; border-radius: 6px; cursor: pointer;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-color: #334155; position: relative; z-index: 2; filter: grayscale(100%);
            opacity: 0.4; transition: border-color 0.15s, filter 0.3s ease, opacity 0.3s ease;
        }

        .vigilante-card:hover { border-color: #fff !important; z-index: 10; }
        .borda-seoe { border-color: #22c55e !important; box-shadow: inset 0 0 6px #22c55e; }
        .borda-supervisor { border-color: #eab308 !important; box-shadow: inset 0 0 4px #eab308; }
        .borda-intermitente { border-color: #dc2626 !important; box-shadow: inset 0 0 4px #dc2626; }
        .borda-vigilante { border-color: #64748b; }

        #container-seoe .vigilante-card, .grupo-ativo .vigilante-card, .intermitente-ativo-hoje { 
            filter: grayscale(0%) !important; opacity: 1 !important; 
        }
        #container-seoe .vigilante-container > .vigilante-card > div[style*="background: rgba(0, 0, 0, 0.75)"] { display: none !important; }

        .vigilante-nome-tag {
            position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.75);
            color: #fff; font-size: 10px; font-weight: 600; text-align: center; padding: 2px 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 0 0 4px 4px;
        }

        /* =========================================
           TOOLTIP
           ========================================= */
        #global-tooltip {
            position: fixed; display: none; width: 420px; background-color: #ffffff; color: var(--text-dark);
            border: 2px solid #64748b; border-radius: 8px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 99999; pointer-events: none;
        }
        .tooltip-estrutura { display: flex; gap: 15px; align-items: flex-start; }
        .tooltip-foto-container { width: 150px; height: 190px; border-radius: 6px; border: 2px solid #cbd5e1; background-size: cover; background-position: center; background-color: #e2e8f0; flex-shrink: 0; }
        .tooltip-dados { flex: 1; display: flex; flex-direction: column; }
        .tooltip-header { font-weight: bold; font-size: 14px; border-bottom: 2px solid #cbd5e1; padding-bottom: 4px; margin-bottom: 8px; color: #0f172a; text-transform: uppercase; }
        .tooltip-linha { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; line-height: 1.2; }
        .tooltip-linha span:first-child { color: #64748b; font-weight: 600; padding-right: 5px; }
        .tooltip-linha span:last-child { color: #0f172a; font-weight: 700; text-align: right; word-break: break-word; }
        .posto-destaque { background: #f1f5f9; padding: 5px 8px; border-radius: 4px; margin-top: 6px; border-left: 3px solid #2563eb; font-size: 11px; font-weight: bold; line-height: 1.3; }
        .status-alerta { color: #dc2626 !important; }

        .cursor-none { cursor: none; }
    </style>
</head>
<body>

    <div class="header-painel">
        <div class="logo-area">ITAIPU BINACIONAL</div>
        <h1>Divisão de Segurança Externa</h1>
        <div id="data-atual" style="font-weight: 600; color: #cbd5e1;"></div>
    </div>
    
    <div class="area-status-superior" style="margin-bottom: 15px;">
        <div class="linha-status">
            <div class="label-status">SEOE</div>
            <div id="container-seoe" class="fotos-status-linha" style="max-height: 100px;"></div>
        </div>
    </div>

    <div class="quadro-principal">
        <div class="grade-grupos" id="grade-operacional">
            <div class="secao-bloco" id="bloco-grupo-a"><div class="titulo-secao bg-grupo-a">Grupo A</div><div id="container-grupo-a" class="zona-fotos"></div></div>
            <div class="secao-bloco" id="bloco-grupo-b"><div class="titulo-secao bg-grupo-b">Grupo B</div><div id="container-grupo-b" class="zona-fotos"></div></div>
            <div class="secao-bloco" id="bloco-grupo-c"><div class="titulo-secao bg-grupo-c">Grupo C</div><div id="container-grupo-c" class="zona-fotos"></div></div>
            <div class="secao-bloco" id="bloco-grupo-d"><div class="titulo-secao bg-grupo-d">Grupo D</div><div id="container-grupo-d" class="zona-fotos"></div></div>
        </div>
    </div>

    <div class="area-status-inferior">
        <div class="linha-status"><div class="label-status">Reciclagem</div><div id="container-reciclagem" class="fotos-status-linha"></div></div>
        <div class="linha-status"><div class="label-status">Atestado</div><div id="container-atestado" class="fotos-status-linha"></div></div>
        <div class="linha-status"><div class="label-status">Férias</div><div id="container-ferias" class="fotos-status-linha"></div></div>
        <div class="linha-status"><div class="label-status">Intermitentes</div><div id="container-intermitentes" class="fotos-status-linha"></div></div>
    </div>

    <div id="global-tooltip"></div>

    <script>
	
	function agendarAtualizacaoMeiaNoite() {
    const agora = new Date();
    const amanha = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() + 1, 1, 0, 0);
    const tempoAteMeiaNoite = amanha - agora;
    
    setTimeout(() => {
        location.reload();
    }, tempoAteMeiaNoite);
}

agendarAtualizacaoMeiaNoite();
	
        /* ==========================================================================
           1. CONFIGURAÇÕES E ESTADO GERAL
           ========================================================================== */
        const CONFIG = {
            URL_API: "https://script.google.com/macros/s/AKfycbyfMiZompnkaTl7qxAPvvNcAiP3ZmUE-KyB_WVh7K5kJnojU4tGITf8jK-2snM94RfLqw/exec",
            REF_DATE: new Date(2026, 4, 21, 0, 0, 0),
            UPDATE_INTERVAL: 5 * 60 * 1000,
            IDLE_TIME: 3000,
            ORDEM_GRUPOS: { "GRUPO A": 1, "GRUPO B": 2, "GRUPO C": 3, "GRUPO D": 4 },
            BLOCOS_MAP: { 'bloco-grupo-a': 0, 'bloco-grupo-b': 1, 'bloco-grupo-c': 2, 'bloco-grupo-d': 3 }
        };

        const STATE = {
            grupoAtivo: "GRUPO A",
            timerCursor: null
        };

        const DOM = {
            tooltip: document.getElementById('global-tooltip'),
            grade: document.getElementById('grade-operacional'),
            dataAtual: document.getElementById('data-atual')
        };

        /* ==========================================================================
           2. SISTEMA DE PROTEÇÃO (Modo Quiosque)
           ========================================================================== */
        function initKioskMode() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.onkeydown = e => {
                if(e.keyCode == 123) return false;
                if(e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67)) return false;
                if(e.ctrlKey && e.keyCode == 85) return false;
            };

            const esconderCursor = () => document.body.classList.add('cursor-none');
            const mostrarCursor = () => {
                document.body.classList.remove('cursor-none');
                clearTimeout(STATE.timerCursor);
                STATE.timerCursor = setTimeout(esconderCursor, CONFIG.IDLE_TIME);
            };

            document.addEventListener('mousemove', mostrarCursor);
            STATE.timerCursor = setTimeout(esconderCursor, CONFIG.IDLE_TIME);

            const agora = new Date();
            const amanha = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() + 1, 0, 0, 0);
            setTimeout(() => location.reload(), amanha - agora);
        }

        /* ==========================================================================
           3. MOTOR DE REGRAS DE NEGÓCIO E DADOS
           ========================================================================== */
        function calcularGrupoDeServico() {
            const agora = new Date();
            const hora = agora.getHours();
            let dataHojeZerada = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate(), 0, 0, 0);
            let diferencaTempo = dataHojeZerada.getTime() - CONFIG.REF_DATE.getTime();
            
            if (hora < 6) diferencaTempo -= (1000 * 60 * 60 * 24);

            const diasCorridos = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
            STATE.grupoAtivo = (diasCorridos % 2 === 0) 
                ? ((hora >= 6 && hora < 18) ? "GRUPO A" : "GRUPO C") 
                : ((hora >= 6 && hora < 18) ? "GRUPO B" : "GRUPO D");

            atualizarLayoutSanfona(STATE.grupoAtivo);
        }

        function converterLinkDrive(url) {
            if (!url) return 'https://via.placeholder.com/74x94/334155/FFFFFF?text=?';
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/) || url.match(/id=([a-zA-Z0-9-_]+)/);
            return (match && match[1]) ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w200-h250` : url;
        }

        function isAniversariante(dataNascimento) {
            if (!dataNascimento) return { status: false, idade: "" };
            let partes = dataNascimento.split('-');
            if (partes.length !== 3) return { status: false, idade: "" };
            
            let [anoNasc, mesNasc, diaNasc] = [parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2])];
            let hoje = new Date();
            return {
                status: (hoje.getMonth() === mesNasc && hoje.getDate() === diaNasc),
                idade: hoje.getFullYear() - anoNasc
            };
        }

        /* ==========================================================================
           4. RENDERIZAÇÃO E INTERFACE
           ========================================================================== */
        function atualizarLayoutSanfona(nomeGrupo) {
            let idBlocoAlvo = `bloco-${nomeGrupo.replace(" ", "-").toLowerCase()}`;
            if (!CONFIG.BLOCOS_MAP.hasOwnProperty(idBlocoAlvo)) idBlocoAlvo = "bloco-grupo-a";

            let tamanhos = [0.5, 0.5, 0.5, 0.5]; 
            tamanhos[CONFIG.BLOCOS_MAP[idBlocoAlvo]] = 2.5;
            
            DOM.grade.style.gridTemplateColumns = tamanhos.map(t => `${t}fr`).join(' ');
            
            Object.keys(CONFIG.BLOCOS_MAP).forEach(b => document.getElementById(b).classList.remove('grupo-ativo'));
            document.getElementById(idBlocoAlvo).classList.add('grupo-ativo');
            ajustarDestaqueIntermitentes();
        }

        function ajustarDestaqueIntermitentes() {
            document.querySelectorAll('#container-intermitentes .vigilante-card').forEach(card => {
                card.getAttribute('data-status-escala') === STATE.grupoAtivo 
                    ? card.classList.add('intermitente-ativo-hoje') 
                    : card.classList.remove('intermitente-ativo-hoje');
            });
        }

        function limparTodosOsContainers() {
            document.querySelectorAll('.zona-fotos, .fotos-status-linha').forEach(el => el.innerHTML = '');
        }

        function criarTooltipHTML(v, fotoUrl, aniversario) {
            const formatData = d => (d && d.toString().includes('T')) ? new Date(d).toLocaleDateString('pt-BR') : d;
            const vencAlerta = parseInt(v.diasParaVencer) <= 30 ? 'status-alerta' : '';
            const isAfastado = v.atestado || v.ferias || v.reciclagem;

            let alertasInfo = "";
            if (aniversario.status) alertasInfo += `<div class="posto-destaque" style="border-left-color: #ec4899; background: #fdf2f8; color: #be185d;">🎂 <strong>Aniversariante do dia!</strong></div>`;
            if (v.titularSubstituido) alertasInfo += `<div class="posto-destaque" style="border-left-color: #eab308; background: #fefce8; color: #a16207;">🔄 Substituindo: <strong>${v.titularSubstituido}</strong><br>Motivo: <strong>${v.motivoSubstituicao}</strong></div>`;
            else if (isAfastado && v.substituto && v.substituto.trim() !== "") alertasInfo += `<div class="posto-destaque" style="border-left-color: #dc2626; background: #fef2f2; color: #b91c1c;">🔄 Substituído por:<br><strong>${v.substituto}</strong></div>`;

            let historicoHtml = "";
            if (v.historico && v.historico.length > 0) {
                historicoHtml = `<div style="margin-top:10px; border-top:1px solid #cbd5e1; padding-top:5px;">
                    <div style="font-size:10px; font-weight:bold; color:#475569; margin-bottom:3px;">HISTÓRICO DE POSTOS:</div>
                    ${v.historico.map(h => `<div class="tooltip-linha" style="margin-bottom:2px;"><span>${h.data}:</span> <span>${h.posto}</span></div>`).join('')}
                </div>`;
            }

            return `
                <div class="tooltip-estrutura">
                    <div class="tooltip-foto-container" style="background-image: url('${fotoUrl}');"></div>
                    <div class="tooltip-dados">
                        <div class="tooltip-header">${v.nome}</div>
                        <div class="tooltip-linha"><span>Nº Posto:</span> <span>${v.numPosto || 'N/A'}</span></div>
                        <div class="tooltip-linha"><span>Cadastro:</span> <span>${v.cadastro || 'N/A'}</span></div>
                        <div class="tooltip-linha"><span>Cargo:</span> <span>${v.cargo || 'N/A'}</span></div>
                        <div class="tooltip-linha"><span>Validade CNV:</span> <span>${formatData(v.validadeCnv) || 'N/A'}</span></div>
                        <div class="tooltip-linha"><span>Validade Curso:</span> <span>${formatData(v.validadeCurso) || 'N/A'}</span></div>
                        <div class="tooltip-linha"><span>Dias p/ Vencer:</span> <span class="${vencAlerta}">${v.diasParaVencer || '0'}</span></div>
                        <div class="posto-destaque" style="${v.postoAtual ? '' : 'color:#64748b;'}">📍 ${v.postoAtual || 'Posto Não Definido'}</div>
                        ${alertasInfo}
                        <div class="tooltip-linha"><span>Ramal Posto:</span> <span>${v.ramalEscala || 'N/A'}</span></div>
                        ${historicoHtml} 
                    </div>
                </div>
            `;
        }

        function adicionarVigilanteNaTela(vigilante, idContainer) {
            const container = document.getElementById(idContainer);
            if (!container) return;

            const isAfastado = ['container-reciclagem', 'container-atestado', 'container-ferias'].includes(idContainer);
            const cargo = (vigilante.cargo || "").toUpperCase().trim();
            
            const wrapper = document.createElement('div'); 
            wrapper.className = 'vigilante-container';
            const card = document.createElement('div'); 
            card.className = 'vigilante-card';
            
            if (cargo.includes("SEOE")) card.classList.add('borda-seoe');
            else if (["SUPERVISOR OPERACIONAL", "SUPERVISOR ADMINISTRATIVO", "COORDENADOR"].includes(cargo)) card.classList.add('borda-supervisor');
            else if (cargo.includes("INTERMITENTE")) card.classList.add('borda-intermitente');
            else card.classList.add('borda-vigilante');

            card.setAttribute('data-status-escala', (vigilante.statusAtual || "").toUpperCase());
            
            // Controle de Imagem com Exponential Backoff
            const fotoUrl = converterLinkDrive(vigilante.driveUrl);
            card.style.backgroundColor = "#1e293b";
            
            function tentarCarregarImagem(url, elemento, tentativas = 3) {
                if (!url || url.includes('via.placeholder.com')) {
                    elemento.style.backgroundImage = `url('${url}')`;
                    return;
                }
                const img = new Image();
                img.onload = () => elemento.style.backgroundImage = `url('${url}')`;
                img.onerror = () => {
                    if (tentativas > 0) {
                        const tempoEspera = (4 - tentativas) * 1500; // Aguarda 1.5s, 3.0s, 4.5s
                        setTimeout(() => tentarCarregarImagem(url, elemento, tentativas - 1), tempoEspera);
                    } else {
                        elemento.style.backgroundImage = `url('https://via.placeholder.com/74x94/334155/FFFFFF?text=Erro')`;
                    }
                };
                img.src = url;
            }

            tentarCarregarImagem(fotoUrl, card);

            const tagSuperior = document.createElement('div');
            tagSuperior.style.cssText = 'position:absolute; top:0; left:0; right:0; background:rgba(0,0,0,0.75); display:flex; justify-content:space-between; padding:1px 3px; font-size:14px; font-weight:bold; color:#fff; border-bottom:1px solid rgba(255,255,255,0.1);';
            tagSuperior.innerHTML = `
                <span style="color:${isAfastado ? '#fbbf24' : 'inherit'};">${isAfastado ? (vigilante.grupoPuro || "-") : (vigilante.numPosto || "-")}</span>
                <span style="color:#94a3b8;">${vigilante.ramalEscala ? "📞" + vigilante.ramalEscala : ""}</span>
            `;
            card.appendChild(tagSuperior);

            const aniversario = isAniversariante(vigilante.dataNascimento);
            if (aniversario.status) {
                const balao = document.createElement('div');
                balao.innerText = "🎈";
                balao.style.cssText = 'position:absolute; top:-8px; right:-8px; font-size:20px; z-index:20; filter:drop-shadow(0px 2px 2px rgba(0,0,0,0.5));';
                card.appendChild(balao);
            }

            const tagNome = document.createElement('div');
            tagNome.className = 'vigilante-nome-tag';
            tagNome.innerText = vigilante.nomeExibicao || vigilante.nome.split(' ')[0] || "Vigilante";
            card.appendChild(tagNome);

            card.addEventListener('mouseenter', () => {
                DOM.tooltip.innerHTML = criarTooltipHTML(vigilante, fotoUrl, aniversario);
                DOM.tooltip.style.display = 'block';
            });
            card.addEventListener('mousemove', (e) => {
                const w = 440, h = DOM.tooltip.offsetHeight || 230;
                let x = e.clientX + 20, y = e.clientY - 40;
                if (x + w > window.innerWidth) x = e.clientX - w - 10;
                if (y + h > window.innerHeight) y = e.clientY - h + 10;
                DOM.tooltip.style.left = `${x}px`; DOM.tooltip.style.top = `${Math.max(y, 10)}px`;
            });
            card.addEventListener('mouseleave', () => DOM.tooltip.style.display = 'none');

            wrapper.appendChild(card);
            container.appendChild(wrapper);
        }

        /* ==========================================================================
           5. ORQUESTRAÇÃO DE DADOS E ROTEAMENTO
           ========================================================================== */
        async function puxarDadosDoSheets() {
            try {
                const response = await fetch(CONFIG.URL_API);
                const listaBruta = await response.json();
                
                limparTodosOsContainers();

                const mapaDadosGeral = {};
                const mapaSubstitutos = {}; 

                listaBruta.forEach(v => { 
                    const nomeUpper = (v.nome || "").toUpperCase().trim();
                    if (nomeUpper) mapaDadosGeral[nomeUpper] = v; 
                    
                    if ((v.atestado || v.ferias || v.reciclagem) && v.substituto && v.substituto.trim() !== "") {
                        mapaSubstitutos[v.substituto.toUpperCase().trim()] = {
                            grupo: (v.statusAtual || "").toUpperCase().trim(),
                            titularSubstituido: v.nome,
                            motivoSubstituicao: v.ferias ? "Férias" : v.atestado ? "Atestado" : "Reciclagem"
                        };
                    }
                });

                // SEOE
                listaBruta.filter(v => v.cargo && v.cargo.toUpperCase().includes("SEOE"))
                          .sort((a, b) => a.dataAdmissao - b.dataAdmissao)
                          .forEach(v => adicionarVigilanteNaTela(v, 'container-seoe'));

                // AFASTADOS (Ordenados por Grupo)
                const afastados = listaBruta.filter(v => v.atestado || v.ferias || v.reciclagem);
                afastados.sort((a, b) => (CONFIG.ORDEM_GRUPOS[a.statusAtual?.toUpperCase()] || 99) - (CONFIG.ORDEM_GRUPOS[b.statusAtual?.toUpperCase()] || 99));
                afastados.forEach(v => {
                    const idContainer = v.reciclagem ? 'container-reciclagem' : v.atestado ? 'container-atestado' : 'container-ferias';
                    adicionarVigilanteNaTela(v, idContainer);
                });

                // ROTEAMENTO 3: ATIVOS E SUBSTITUTOS (Ordenados por Posto)
                const ativos = listaBruta.filter(v => !(v.atestado || v.ferias || v.reciclagem) && !(v.cargo && v.cargo.toUpperCase().includes("SEOE")));
                ativos.sort((a, b) => parseInt((a.numPosto || "").toString().replace(/\D/g, '')) - parseInt((b.numPosto || "").toString().replace(/\D/g, '')));
                
                ativos.forEach(v => {
                    const status = (v.statusAtual || "").toUpperCase();
                    const cargo = (v.cargo || "").toUpperCase().trim();
                    const nomeUpper = (v.nome || "").toUpperCase().trim();
                    let vigilanteTratado = { ...v };

                    // 1. INJETA DADOS DO TITULAR SE ELE FOR UM SUBSTITUTO
                    if (mapaSubstitutos[nomeUpper]) {
                        vigilanteTratado.statusAtual = mapaSubstitutos[nomeUpper].grupo;
                        vigilanteTratado.titularSubstituido = mapaSubstitutos[nomeUpper].titularSubstituido;
                        vigilanteTratado.motivoSubstituicao = mapaSubstitutos[nomeUpper].motivoSubstituicao;
                    }

                    // 2. TODOS OS ATIVOS (Substitutos ou não, Intermitentes ou não) VÃO PARA A GRADE DE POSTOS
                    const st = vigilanteTratado.statusAtual || "";
                    if (st.includes("GRUPO A")) adicionarVigilanteNaTela(vigilanteTratado, 'container-grupo-a');
                    else if (st.includes("GRUPO B")) adicionarVigilanteNaTela(vigilanteTratado, 'container-grupo-b');
                    else if (st.includes("GRUPO C")) adicionarVigilanteNaTela(vigilanteTratado, 'container-grupo-c');
                    else if (st.includes("GRUPO D")) adicionarVigilanteNaTela(vigilanteTratado, 'container-grupo-d');

                    // 3. SE FOR INTERMITENTE, É DUPLICADO PARA O CONTAINER INFERIOR DE CONTROLE
                    if (cargo.includes("INTERMITENTE") || status === "INTERMITENTE") {
                        adicionarVigilanteNaTela(vigilanteTratado, 'container-intermitentes');
                    }
                });

                ajustarDestaqueIntermitentes();

            } catch (error) {
                console.error("Erro Crítico ao processar dados da API:", error);
                // Previsão de ajuste futuro: Exibir alerta na tela se a internet cair.
            }
        }

        /* ==========================================================================
           6. INICIALIZAÇÃO
           ========================================================================== */
        Object.keys(CONFIG.BLOCOS_MAP).forEach(idBloco => {
            const el = document.getElementById(idBloco);
            let hoverTimer;
            el.addEventListener('mouseenter', () => {
                hoverTimer = setTimeout(() => atualizarLayoutSanfona(idBloco.replace('bloco-', '').replace('-', ' ')), 200);
            });
            el.addEventListener('mouseleave', () => clearTimeout(hoverTimer));
        });

        DOM.grade.addEventListener('mouseleave', calcularGrupoDeServico);
        
        DOM.dataAtual.innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        initKioskMode();
        calcularGrupoDeServico(); 
        puxarDadosDoSheets();
        
        setInterval(calcularGrupoDeServico, 60 * 1000); 
        setInterval(puxarDadosDoSheets, CONFIG.UPDATE_INTERVAL);

    </script>
</body>
</html>
